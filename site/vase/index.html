<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lei Moon Jar</title>
<meta name="description" content="Parametric moon jar maker for large-format PETG printing: shape it, check printability, export STL and STEP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world: a dark photo studio, where clear PETG reads the way it does under real lights.
     Phone: the jar on top, checks and settings below it. Wide screens: the jar left, settings right. */
  color-scheme: dark;
  --bg: #0f0e0d;
  --surface: #171615;
  --raise: #23211f;
  --line: #34312d;
  --text: #f3eee6;
  --muted: #a69f94;
  --accent: #f0a3b8;
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --display: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
  --body: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }   /* author display rules (e.g. .gl-msg grid) must not resurrect hidden overlays */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(220px, 1fr) minmax(270px, 1fr); }
#top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 16px 9px; border-bottom: 1px solid var(--line); background: var(--bg); }
h1 { margin: 0; font: 700 21px/1.1 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
h1 .ko { font-size: 0.7em; color: var(--muted); margin-left: 8px; letter-spacing: 0.04em; }
.dims { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }

#stage { position: relative; min-height: 0; overflow: hidden; background: #070606; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#view:active { cursor: grabbing; }
#view:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.gl-msg { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); }
.ov { position: absolute; display: flex; gap: 6px; align-items: center; }
.ov.tl { top: 10px; left: 12px; }
.ov.tr { top: 10px; right: 12px; }
.ov.bl { bottom: 12px; left: 12px; }
.ov.br { bottom: 12px; right: 12px; }
#hint { font-size: 12.5px; color: var(--muted); transition: opacity .4s; pointer-events: none; }
#hint.gone { opacity: 0; }
.chip { font-weight: 500; font-size: 13px; line-height: 1; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(23, 22, 21, 0.78); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.pill { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; line-height: 1; padding: 7px 11px 7px 8px; border-radius: 999px; border: 1px solid var(--line); background: rgba(23, 22, 21, 0.86); cursor: pointer; }
.pill .ic { display: inline-flex; width: 16px; height: 16px; }
.pill .ic svg, .st svg { width: 100%; height: 100%; display: block; }
.pill[data-state="good"] .ic { color: var(--good); }
.pill[data-state="warn"] .ic { color: var(--warn); }
.pill[data-state="fail"] .ic { color: var(--crit); }
.pill[data-state="checking"] { color: var(--muted); }
.spin { animation: spin 0.9s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: rgba(23, 22, 21, 0.78); cursor: pointer; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.legend { position: absolute; left: 12px; top: 10px; width: min(196px, calc(100% - 170px)); min-width: 150px; padding: 7px 9px 6px; border-radius: 8px; background: rgba(15, 14, 13, 0.82); border: 1px solid var(--line); }
.legend p { margin: 0 0 5px; font-size: 11.5px; color: var(--muted); }
.legend .bar { height: 7px; border-radius: 4px; background: linear-gradient(to right, #184f95, #256abf, #3987e5, #6da7ec, #9ec5f4, #cde2fb); }
.legend .ticks { position: relative; height: 0; }
.legend .ticks span { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend .ticks span:first-child { transform: none; }
.legend .ticks span:last-child { transform: translateX(-100%); color: var(--text); }
.legend .over { display: flex; align-items: center; gap: 6px; margin-top: 19px; font-size: 11px; color: var(--muted); }
.legend .over i { width: 10px; height: 10px; border-radius: 2px; background: var(--crit); }
.toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 9px 14px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 13.5px; font-weight: 500; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }

#side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-top: 1px solid var(--line); }
.kpis { flex: 0 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 0.85fr) minmax(0, 0.75fr); gap: 4px 10px; margin: 0; padding: 9px 16px 8px; border-bottom: 1px solid var(--line); }
.kpis div { min-width: 0; }
.kpis dt { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpis dd { margin: 1px 0 0; font-size: 15.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpis dd small { font-size: 12px; font-weight: 400; color: var(--muted); }
.kpis.stale dd { color: var(--muted); }
.tabs { flex: 0 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 6px; border-bottom: 1px solid var(--line); -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; font-weight: 500; font-size: 14px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 10px 10px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
#panes { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 16px 28px; overscroll-behavior: contain; }
.pane { max-width: 560px; }
.intro { margin: 12px 0 4px; font-size: 13.5px; color: var(--muted); max-width: 62ch; }
.group h3, #report h3 { margin: 18px 0 4px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.ctl { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding: 9px 0 6px; border-bottom: 1px solid rgba(52, 49, 45, 0.55); }
.ctl label { font-size: 14.5px; }
.ctl.off { opacity: 0.4; }
.num { display: flex; align-items: baseline; gap: 5px; justify-self: end; }
.num input { width: 4.4em; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--raise); text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.unit { font-size: 12px; color: var(--muted); min-width: 1.5em; white-space: nowrap; }
.ctl input[type=range] { grid-column: 1 / -1; width: 100%; height: 30px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.ctl input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) 0 var(--fill, 50%), var(--line) var(--fill, 50%) 100%); }
.ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; border: 0; background: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, .55); }
.ctl input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
.ctl input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
.ctl input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--text); }
.hint { grid-column: 1 / -1; margin: 0 0 2px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl-switch { grid-template-columns: minmax(0, 1fr) auto; padding: 11px 0; }
.ctl-switch label { display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.ctl-switch .sub { font-size: 12.5px; color: var(--muted); }
.ctl-switch input { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; margin: 0; border-radius: 13px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; }
.ctl-switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.ctl-switch input:checked { background: var(--accent); }
.ctl-switch input:checked::after { transform: translateX(18px); background: #2a1219; }
.ctl-seg { display: block; padding: 10px 0 8px; }
.seg-label { margin: 0 0 7px; font-size: 14.5px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--raise); font-size: 13.5px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.seg .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); }
.ctl-seg .hint { margin-top: 7px; }
.btn { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); font-size: 14px; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.wide { width: 100%; margin-top: 16px; padding: 12px 14px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.msg { min-height: 1.2em; margin: 8px 0 0; font-size: 13px; color: var(--text); }
.fine { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); max-width: 62ch; }
textarea { width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
.rep-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.verdict { margin: 0; font: 700 18px/1.25 var(--display); }
.notes { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.notes li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 9px; font-size: 13.5px; }
.st { display: inline-flex; width: 16px; height: 16px; margin-top: 2px; }
.st.ok, .st.good { color: var(--good); }
.st.warn { color: var(--warn); }
.st.fail { color: var(--crit); }
.st.info { color: var(--muted); }
dl.rep { margin: 0; }
dl.rep .r { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 16px; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(52, 49, 45, 0.55); font-size: 13.5px; }
dl.rep dt { color: var(--muted); }
dl.rep dd { margin: 0; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (min-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr) 410px; grid-template-rows: auto minmax(0, 1fr); }
  #top { grid-column: 1 / -1; }
  #stage { grid-column: 1; grid-row: 2; }
  #side { grid-column: 2; grid-row: 2; border-top: 0; border-left: 1px solid var(--line); }
  .tabs { flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; }
}
@media (max-width: 380px) {
  .kpis { gap: 4px 6px; padding: 8px 12px; }
  .kpis dd { font-size: 14px; }
  .kpis dd small { font-size: 11px; }
  #panes { padding: 2px 12px 28px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .spin { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>Lei Moon Jar<span class="ko" lang="ko">달항아리</span></h1>
    <p class="dims" id="dims">Ø300 × 450 mm</p>
  </header>
  <section id="stage" aria-label="3D view of the jar">
    <canvas id="view" tabindex="0" aria-label="The jar. Drag to turn it, pinch or scroll to zoom, double-click to reset. Arrow keys also turn it."></canvas>
    <p class="gl-msg" id="gl-msg" hidden></p>
    <p class="ov tl" id="hint">Drag to turn · pinch to zoom</p>
    <div class="ov tr">
      <button type="button" class="btn small" id="b-fix" hidden>Fix it</button>
      <button type="button" class="pill" id="pill" data-state="checking" aria-label="Printability. Open the report."><span class="ic" id="pill-ic"></span><span id="pill-text">Checking</span></button>
    </div>
    <div class="legend" id="legend" hidden>
      <p>Wall lean from vertical</p>
      <div class="bar"></div>
      <div class="ticks" id="legend-ticks"></div>
      <div class="over"><i></i>past the limit</div>
    </div>
    <div class="ov bl" role="group" aria-label="Show">
      <button type="button" class="chip" data-view="petg" aria-pressed="true">Clear PETG</button>
      <button type="button" class="chip" data-view="lean" aria-pressed="false">Overhang map</button>
    </div>
    <div class="ov br">
      <button type="button" class="icon-btn" id="b-home" aria-label="Reset the view"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.2 10a5.8 5.8 0 1 0 1.9-4.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5.6 2.6v3.6h3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <p class="toast" id="toast" role="status" hidden></p>
  </section>
  <aside id="side" aria-label="Checks and settings">
    <dl class="kpis stale" id="kpis">
      <div><dt>Steepest lean</dt><dd id="k-lean">–</dd></div>
      <div><dt>Bead turn</dt><dd id="k-turn">–</dd></div>
      <div><dt>Mass</dt><dd id="k-mass">–</dd></div>
      <div><dt>Holds</dt><dd id="k-cap">–</dd></div>
    </dl>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Settings"></nav>
    <div id="panes"></div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="js-core">
/* Lei Moon Jar: parametric generator. No DOM. Runs in a browser page and in Node.
   Surface = turned profile + relief:  r(theta, z) = r0(z) + relief(theta, z)
   All lengths mm, angles in degrees at the interface. */
(function (root) {
  "use strict";
  var PI = Math.PI, TAU = 2 * Math.PI;

  var DEFAULTS = {
    // process
    nozzle: 5, bead_w: 6, layer_h: 2, max_overhang_deg: 35, min_radius_beads: 2, base_layers: 10, print_speed: 40,
    // material
    density: 1.27,
    // size and form
    height: 450, max_d: 300, foot_pct: 62.7, neck_pct: 54, belly_pct: 48, neck_len_pct: 10.7,
    foot_lean_deg: 30, shoulder_lean_deg: 34, lip_lean_deg: 28,
    // lei of plumeria
    n_flowers: 5, front_deg: 0, lei_rise: 4, lei_drape: 18, petal_pct: 29.3, petal_var_pct: 1.7,
    petal_w: 0.33, petal_p: 1.40, petal_q: 0.85, swirl: 0.50, lead: 9, trail_ratio: 0.5, tip_drop: 0.12, throat_ratio: 0.5,
    flower_twist_deg: [4, -7, 6, -5, 8, -3, 5, -6],
    // echo lines
    echo_pitch_beads: 4.5, echo_amp: 1.4, echo_rings_up: 3,
    // seigaiha waves
    wave_count: 0, wave_rings: 2, wave_amp: 1.3, wave_step: 0.5,
    // softening, in bead widths / layer heights
    soft_round_beads: 1.15, soft_up_layers: 1.75, soft_fine_beads: 0.55, soft_final_beads: 0.2,
    // pouring lip
    spout: 1, spout_deg: 0, spout_reach: 36, spout_lean_deg: 26, spout_nose_beads: 2.6, spout_width: 1
  };

  function smoothstep(a, b, x) { var t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
  function wrap(a) { a = (a + PI) % TAU; if (a < 0) a += TAU; return a - PI; }
  function rad(d) { return d * PI / 180; }
  function deg(r) { return r * 180 / PI; }

  function gaussKernel(sigma) {
    if (!(sigma > 0.05)) return new Float64Array([1]);
    var R = Math.max(1, Math.ceil(3 * sigma)), k = new Float64Array(2 * R + 1), s = 0, i;
    for (i = -R; i <= R; i++) { k[i + R] = Math.exp(-0.5 * i * i / (sigma * sigma)); s += k[i + R]; }
    for (i = 0; i < k.length; i++) k[i] /= s;
    return k;
  }

  /* Convex arc, vertical at the belly, leaning lean_deg where it ends: part of an ellipse. */
  function halfMeridian(z, zb, rb, ze, re, leanDeg) {
    var dr = rb - re, dzz = Math.abs(ze - zb), s = Math.tan(rad(leanDeg)), m = dr / (s * dzz);
    var t = Math.abs(z - zb) / dzz; if (t > 1) t = 1;
    if (m >= 0.5) return rb - dr * t * t;
    var q = m / (1 - m), k = Math.sqrt(1 - q * q), a = dr / (1 - q);
    return rb - a * (1 - Math.sqrt(1 - k * k * t * t));
  }
  function halfMeridianLean(rb, re, dzz, leanDeg) {
    var dr = rb - re, m = dr / (Math.tan(rad(leanDeg)) * dzz);
    return m >= 0.5 ? deg(Math.atan(2 * dr / dzz)) : leanDeg;
  }

  function derive(P) {
    var D = {};
    D.H = P.height; D.w = P.bead_w; D.h = P.layer_h;
    D.foot_h = P.base_layers * P.layer_h;
    D.r_foot = P.max_d * P.foot_pct / 200;
    D.r_neck = P.max_d * P.neck_pct / 200;
    D.belly_z = P.height * P.belly_pct / 100;
    D.neck_len = P.height * P.neck_len_pct / 100;
    D.shoulder_z = P.height - D.neck_len;
    D.cap = P.max_overhang_deg;
    D.lean_f = Math.min(P.foot_lean_deg, D.cap - 5);
    D.lean_s = Math.min(P.shoulder_lean_deg, D.cap - 1);
    D.lean_l = Math.min(P.lip_lean_deg, D.cap - 2);
    D.petal_len = P.max_d * P.petal_pct / 100;
    D.petal_var = P.max_d * P.petal_var_pct / 100;
    D.trail = P.lead * P.trail_ratio;
    D.throat = P.lead * P.throat_ratio;
    D.k = P.height / 450;                       // scale for the few lengths that follow the height
    return D;
  }

  function profile(P, D, z, rBelly) {
    var NZ = z.length, dz = z[1] - z[0], j;
    var sn = Math.tan(rad(D.lean_s)), sl = Math.tan(rad(D.lean_l)), L = D.H - D.shoulder_z;
    var rsh = D.r_neck + L * sn * sn / (2 * (sn + sl));
    var pad = Math.round(20 / dz), ext = new Float64Array(NZ + 2 * pad);
    for (j = 0; j < NZ; j++) {
      var zz = z[j], v;
      if (zz < D.foot_h) v = D.r_foot;
      else if (zz <= D.belly_z) v = halfMeridian(zz, D.belly_z, rBelly, D.foot_h, D.r_foot, D.lean_f);
      else if (zz <= D.shoulder_z) v = halfMeridian(zz, D.belly_z, rBelly, D.shoulder_z, rsh, D.lean_s);
      else { var tau = (zz - D.shoulder_z) / L; if (tau > 1) tau = 1; v = rsh + L * (-sn * tau + (sn + sl) * tau * tau / 2); }
      ext[j + pad] = v;
    }
    for (j = 0; j < pad; j++) { ext[j] = ext[pad]; ext[NZ + pad + j] = ext[NZ + pad - 1] + sl * dz * (j + 1); }
    var k = gaussKernel(2.5 / dz), R = (k.length - 1) / 2, r0 = new Float64Array(NZ), n = ext.length;
    for (j = 0; j < NZ; j++) {
      var s = 0;
      for (var q = -R; q <= R; q++) { var idx = j + pad + q; if (idx < 0) idx = 0; else if (idx >= n) idx = n - 1; s += k[q + R] * ext[idx]; }
      var wgt = smoothstep(D.foot_h - 9, D.foot_h - 3, z[j]);
      r0[j] = D.r_foot + (s - D.r_foot) * wgt;
    }
    return { r0: r0, rsh: rsh,
      foot_lean: halfMeridianLean(rBelly, D.r_foot, D.belly_z - D.foot_h, D.lean_f),

      { t: "seg", o: "look", k: "light", label: "Lighting", opts: Object.keys(LIGHTS).map(k => [k, LIGHTS[k].label]) },

    ] }], custom: viewExtras },

  function detailHint() {
    const E = window.LeiEngine; if (!E) return "";
    const r = E.resFor(E.fill(P), out.detail);
    return `${r.nTheta} points round, every ${g(r.dz)} mm up.` + (out.detail === "fine" ? " The checks use this grid." : " Smaller files, for viewing.");
  }

  function objOf(c) { const o = c.o || "P"; return o === "P" ? P : o === "look" ? look : out; }

  function makeControl(c) {
    const t = c.t || "range", id = `${c.o || "P"}-${c.k}`, box = document.createElement("div");
    box.className = "ctl ctl-" + t;
    if (t === "range") {
      box.innerHTML = `<label for="r-${id}">${c.label}</label>` +
        `<span class="num"><input id="n-${id}" type="number" inputmode="decimal" min="${c.min}" max="${c.max}" step="${c.step}" aria-label="${c.label}, value"><span class="unit">${c.unit || ""}</span></span>` +
        `<input id="r-${id}" type="range" min="${c.min}" max="${c.max}" step="${c.step}">` +
        `<p class="hint" id="h-${id}" hidden></p>`;
      const r = box.querySelector("input[type=range]"), n = box.querySelector("input[type=number]");
      r.addEventListener("input", () => setV(c, Number(r.value)));
      n.addEventListener("change", () => { const v = parseFloat(n.value); if (isFinite(v)) setV(c, clamp(v, c.min, c.max)); else refreshControl(c); });
    } else if (t === "switch") {
      box.innerHTML = `<label for="s-${id}"><span class="lbl">${c.label}</span>${c.sub ? `<span class="sub">${c.sub}</span>` : ""}</label><input id="s-${id}" type="checkbox" role="switch">`;
      box.querySelector("input").addEventListener("change", e => setV(c, (c.o || "P") === "P" ? (e.target.checked ? 1 : 0) : e.target.checked));
    } else {
      box.innerHTML = `<p class="seg-label" id="l-${id}">${c.label}</p><div class="seg" role="group" aria-labelledby="l-${id}"></div><p class="hint" id="h-${id}" hidden></p>`;
      const seg = box.querySelector(".seg");
      c.opts.forEach(([v, lab, dot]) => {
        const b = document.createElement("button");
        b.type = "button"; b.dataset.v = v; b.setAttribute("aria-pressed", "false");
        if (dot) { const s = document.createElement("span"); s.className = "dot"; s.style.background = dot; b.appendChild(s); }
        b.appendChild(document.createTextNode(lab));
        b.addEventListener("click", () => setV(c, v));
        seg.appendChild(b);
      });
    }
    c.el = box; CTL.push(c);
    return box;
  }

  function setV(c, v) {
    const o = c.o || "P", obj = objOf(c);
    if (!c.t || c.t === "range") { if (c.step >= 1) v = Math.round(v); if (c.scale) v = v * 450 / P.height; }
    obj[c.k] = v;
    if (o === "P") { refreshAll(); requestLive(); }
    else if (o === "look") { refreshAll(); applyLook(); }
    else { refreshAll(); }
    persist();
  }

  function refreshControl(c) {
    const box = c.el, v0 = objOf(c)[c.k];
    if (!c.t || c.t === "range") {
      const v = c.scale ? v0 * P.height / 450 : v0, r = box.querySelector("input[type=range]"), n = box.querySelector("input[type=number]");
      r.value = v; if (document.activeElement !== n) n.value = f(v, c.d);
      r.style.setProperty("--fill", (100 * (clamp(v, c.min, c.max) - c.min) / (c.max - c.min)) + "%");
      const off = !!c.lip && !P.spout; r.disabled = n.disabled = off; box.classList.toggle("off", off);
    } else if (c.t === "switch") box.querySelector("input").checked = !!v0;
    else box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(v0))));
  }
  function refreshAll() { CTL.forEach(refreshControl); refreshHints(); }
  function refreshHints() {
    const M = (fine && fineKey === keyOf(P) ? fine : live || {}).M;
    CTL.forEach(c => {
      if (!c.hint) return; const h = c.el.querySelector(".hint"); if (!h) return;
      let s = ""; try { s = c.hint(M || null) || ""; } catch (e) { s = ""; }
      h.textContent = s; h.hidden = !s;
    });
  }

  function buildUI() {
    const nav = $("#tabs"), panes = $("#panes");
    TABS.forEach(t => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "tab"; b.id = "t-" + t.id; b.textContent = t.label;
      b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "p-" + t.id);
      b.addEventListener("click", () => openTab(t.id));
      nav.appendChild(b);
      const p = document.createElement("section");
      p.className = "pane"; p.id = "p-" + t.id; p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "t-" + t.id);
      if (t.intro) { const i = document.createElement("p"); i.className = "intro"; i.textContent = t.intro; p.appendChild(i); }
      (t.groups || []).forEach(gr => {
        const gs = document.createElement("div"); gs.className = "group";

        gr.items.forEach(c => gs.appendChild(makeControl(c)));
        p.appendChild(gs);
      });

      panes.appendChild(p);
    });
    nav.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const i = TABS.findIndex(t => t.id === tab), n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length].id;
      openTab(n); $("#t-" + n).focus(); e.preventDefault();
    });
    // stage controls
    $$("#stage [data-view]").forEach(b => b.addEventListener("click", () => { look.view = b.dataset.view; refreshAll(); applyLook(); persist(); }));
    $("#b-home").addEventListener("click", () => viewer && viewer.preset("home"));
    $("#pill").addEventListener("click", () => openTab("report"));
    $("#b-fix").addEventListener("click", fixIt);
    $$("#cams [data-cam]").forEach(b => b.addEventListener("click", () => viewer && viewer.preset(b.dataset.cam)));
    $("#b-png").addEventListener("click", savePng);
    $("#b-zip").addEventListener("click", doExport);
    $("#b-copy").addEventListener("click", copyParams);
    $("#b-load").addEventListener("click", () => { $("#load-box").hidden = false; $("#t-json").focus(); });
    $("#b-cancel").addEventListener("click", () => { $("#load-box").hidden = true; });
    $("#b-apply").addEventListener("click", loadParams);
    $("#b-reset").addEventListener("click", () => { P = Object.assign({}, DEF); refreshAll(); requestLive(); persist(); say("#par-msg", "Back to the Lei Moon Jar as designed."); });
  }

  function viewExtras(p) {
    p.insertAdjacentHTML("beforeend",
      `<div class="group"><h3>Camera</h3><div class="seg" id="cams"><button type="button" data-cam="lip">Lip side</button><button type="button" data-cam="front">Lip front</button><button type="button" data-cam="top">From above</button><button type="button" data-cam="home">Reset</button></div></div>` +
      `<div class="group"><h3>Image</h3><button type="button" class="btn" id="b-png">Save image (PNG)</button><p class="msg" id="png-msg" aria-live="polite"></p></div>`);
  }
  function exportExtras(p) {
    p.insertAdjacentHTML("beforeend",
      `<div class="group"><button type="button" class="btn primary wide" id="b-zip">Download .zip</button><p class="msg" id="zip-msg" aria-live="polite"></p>` +
      `<p class="fine">Each download is a .zip with the files you picked, parameters.json and a README with the checks.</p></div>` +
      `<div class="group"><h3>Parameters</h3><div class="row"><button type="button" class="btn" id="b-copy">Copy</button><button type="button" class="btn" id="b-load">Load…</button><button type="button" class="btn" id="b-reset">Reset to the Lei Moon Jar</button></div>` +

  function openTab(id) {
    if (!TABS.some(t => t.id === id)) id = "size";
    tab = id;
    $$(".tab").forEach(b => { const on = b.id === "t-" + id; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
    $$(".pane").forEach(p => { p.hidden = p.id !== "p-" + id; });
    $("#panes").scrollTop = 0;
    const tb = $("#t-" + id); if (tb && tb.scrollIntoView) tb.scrollIntoView({ block: "nearest", inline: "nearest" });
    persist();
  }

  /* ======================= engine (Web Workers, page fallback) ======================= */
  const Engine = (() => {
    const src = ["js-core", "js-exporters", "js-engine"].map(id => document.getElementById(id).textContent).join("\n;\n");
    const waiting = new Map(), workers = {};
    let fallback = false, seq = 0, url = null;
    function runHere(msg) {
      return new Promise((res, rej) => setTimeout(() => {
        try { window.LeiEngine.handle(msg).then(r => res(r.out), rej); } catch (e) { rej(e); }
      }, 0));
    }
    function goFallback() {
      if (fallback) return; fallback = true;
      Object.values(workers).forEach(w => { try { w.terminate(); } catch (e) { /* gone */ } });
      const pend = Array.from(waiting.values()); waiting.clear();
      pend.forEach(h => runHere(h.msg).then(h.resolve, h.reject));
    }
    function make() {
      const w = new Worker(url);
      w.onmessage = e => { const m = e.data, h = waiting.get(m.seq); if (!h) return; waiting.delete(m.seq); if (m.cmd === "error") h.reject(new Error(m.message)); else h.resolve(m); };
      w.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); goFallback(); };
      return w;
    }
    try { url = URL.createObjectURL(new Blob([src], { type: "text/javascript" })); workers.live = make(); workers.heavy = make(); }
    catch (e) { fallback = true; }
    function call(lane, msg) {
      msg.seq = ++seq;
      if (fallback) return runHere(msg);
      return new Promise((resolve, reject) => { waiting.set(msg.seq, { resolve, reject, msg }); workers[lane].postMessage(msg); });
    }
    return { call };
  })();

  let liveBusy = false, liveAgain = false, checkTimer = 0;
  function requestLive() {
    setPill("checking");
    clearTimeout(checkTimer); checkTimer = setTimeout(runCheck, 450);
    if (liveBusy) { liveAgain = true; return; }
    liveBusy = true;
    Engine.call("live", { cmd: "live", P: Object.assign({}, P) }).then(m => {
      live = m.info;
      if (viewer) viewer.setMesh(m.mesh, m.info);
      if (!(fine && fineKey === keyOf(P))) showInfo(live, false);
    }).catch(showError).finally(() => {
      liveBusy = false;
      if (liveAgain) { liveAgain = false; requestLive(); }
    });
  }
  function runCheck() {
    const p = Object.assign({}, P), k = keyOf(p);
    Engine.call("heavy", { cmd: "check", P: p }).then(m => {
      if (keyOf(P) !== k) return;
      fine = m.info; fineKey = k; showInfo(fine, true);
    }).catch(showError);
  }

  /* ======================= checks and report ======================= */
  function classify(M, p) {
    const items = [];
    if (M.lean_max > p.max_overhang_deg + 0.05) items.push({ lv: 2, k: "lean", t: `The wall leans ${f(M.lean_max)}°, past the ${g(p.max_overhang_deg)}° limit.` });
    if (M.path_radius_min < M.path_radius_target - 0.05) items.push({ lv: 2, k: "turn", t: `The bead has to turn on a ${f(M.path_radius_min)} mm radius, ${f(M.path_radius_z, 0)} mm up. The limit is ${f(M.path_radius_target)} mm.` });
    if (Math.max(M.foot_lean, M.shoulder_lean) > p.max_overhang_deg + 0.01) items.push({ lv: 1, k: "form", t: "The plain form leans more than the limit, so the wall was pulled in to stay printable. A taller jar, a wider foot or a wider neck keeps the shape you set." });
    const ratio = p.bead_w / p.nozzle;
    if (ratio < 1.2 - 1e-9 || ratio > 1.8 + 1e-9) items.push({ lv: 1, k: "bead", t: `The bead is ${f(100 * ratio, 0)}% of the nozzle bore. Savonia's LFAM guidance gives 120 to 180%.` });
    if (p.layer_h > 0.67 * p.bead_w) items.push({ lv: 1, k: "layer", t: "The layer is taller than two thirds of the bead width." });
    if (M.relaxed_by > 3) items.push({ lv: 0, k: "flat", t: `Relief was flattened by up to ${f(M.relaxed_by)} mm to stay under the overhang limit.` });
    const worst = items.reduce((a, b) => Math.max(a, b.lv), 0);
    return { state: worst === 2 ? "fail" : worst === 1 ? "warn" : "good", items };
  }

  const ICON = {
    good: `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="currentColor"/><path d="M4.6 8.4l2.2 2.2 4.6-4.9" fill="none" stroke="#0f0e0d" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    warn: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l7.2 13.2H.8z" fill="currentColor"/><path d="M8 5.6v4.3" stroke="#0f0e0d" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="12.2" r="1" fill="#0f0e0d"/></svg>`,
    fail: `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="currentColor"/><path d="M5.3 5.3l5.4 5.4M10.7 5.3l-5.4 5.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg>`,
    info: `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 7v4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.8" r="0.95" fill="currentColor"/></svg>`,
    checking: `<svg viewBox="0 0 16 16" aria-hidden="true" class="spin"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
  };
  const PILL = { checking: "Checking", good: "Printable", warn: "Printable, see notes", fail: "Outside limits" };
  function setPill(state, c) {
    const pill = $("#pill");
    pill.dataset.state = state;
    $("#pill-ic").innerHTML = ICON[state];
    $("#pill-text").textContent = PILL[state];
    $("#b-fix").hidden = !(state === "fail" && c && c.items.some(i => i.k === "turn"));
  }

  function showInfo(info, isFine) {
    const M = info.M, p = info.P;
    $("#dims").textContent = `Ø${f(M.widest, 0)} × ${f(M.height, 0)} mm`;
    $("#k-lean").innerHTML = `${f(M.lean_max)}°<small> / ${g(p.max_overhang_deg)}°</small>`;
    $("#k-turn").innerHTML = `${f(M.path_radius_min)}<small> / ${g(M.path_radius_target)} mm</small>`;
    $("#k-mass").textContent = `${f(M.mass_kg, 2)} kg`;
    $("#k-cap").textContent = `${f(M.capacity_l, 1)} L`;
    $("#kpis").classList.toggle("stale", !isFine);
    refreshHints();
    if (isFine) { const c = classify(M, p); setPill(c.state, c); }
    renderReport(info, isFine);
  }

  function row(term, val, st) { return `<div class="r"><dt>${term}</dt><dd>${val}</dd><span class="st ${st || ""}">${st ? ICON[st === "ok" ? "good" : st] : ""}</span></div>`; }
  function renderReport(info, isFine) {
    const M = info.M, p = info.P, c = classify(M, p), el = $("#report");
    if (!el) return;
    const leanOk = M.lean_max <= p.max_overhang_deg + 0.05, turnOk = M.path_radius_min >= M.path_radius_target - 0.05;
    const notes = c.items.map(i => `<li class="lv${i.lv}"><span class="st ${i.lv === 2 ? "fail" : i.lv === 1 ? "warn" : "info"}">${ICON[i.lv === 2 ? "fail" : i.lv === 1 ? "warn" : "info"]}</span><span>${i.t}</span></li>`).join("");
    el.innerHTML =
      `<div class="rep-head"><p class="verdict ${isFine ? c.state : "checking"}">${isFine ? { good: "Every check passes.", warn: "Printable. Read the notes.", fail: "Outside the limits." }[c.state] : "Live preview. The full check follows."}</p>` +
      `${isFine && c.items.some(i => i.k === "turn") ? `<button type="button" class="btn small" id="b-fix2">Fix it</button>` : ""}</div>` +
      (notes ? `<ul class="notes">${notes}</ul>` : "") +
      `<p class="msg" id="rep-msg" aria-live="polite"></p>` +
      `<h3>Printability</h3><dl class="rep">` +
      row("Steepest wall lean", `${f(M.lean_max)}° at ${f(M.lean_max_z, 0)} mm up; limit ${g(p.max_overhang_deg)}°`, leanOk ? "ok" : "fail") +
      row("Sideways step per layer", `${f(M.step_max_mm, 2)} mm, ${f(M.step_max_pct, 0)}% of the bead`) +
      row("Wall leaning over 30°", `${f(M.share_over_30, 1)}% of the surface`) +
      row("Tightest bead turn", `${f(M.path_radius_min)} mm radius at ${f(M.path_radius_z, 0)} mm up; limit ${f(M.path_radius_target)} mm`, turnOk ? "ok" : "fail") +
      row("Layers", `${M.layers}: ${M.layers_base} solid base, ${M.layers_wall} wall. Each is one closed outline round the axis, so the wall can print as one spiral.`, "ok") +
      row("Shortest layer", `${f(M.loop_min, 0)} mm loop, ${f(M.layer_time_min, 1)} s at ${g(p.print_speed)} mm/s, ${f(M.loop_min_z, 0)} mm up`) +
      row("Bead to nozzle", `${f(p.bead_w, 1)} mm bead from a ${g(p.nozzle)} mm bore, ${f(100 * p.bead_w / p.nozzle, 0)}%`, c.items.some(i => i.k === "bead") ? "warn" : "") +
      `</dl><h3>Size</h3><dl class="rep">` +
      row("Widest", `Ø${f(M.widest, 1)} mm`) +
      row("Height", `${f(M.height, 0)} mm, ${M.layers} layers of ${g(p.layer_h)} mm`) +
      row("Foot", `Ø${f(M.foot_d, 1)} mm`) +

      U.uEnvFrame.value.setFromMatrix4(m4.makeRotationY(-cam.az));
      const ka = LIGHTS[look.light].keyBox[0], sx = -Math.sin(ka), sz = Math.cos(ka), co = Math.cos(cam.az), si = Math.sin(cam.az);
      U.uShadow.value.set(sx * co + sz * si, -sx * si + sz * co).normalize();
      U.uInvVP.value.multiplyMatrices(camera.matrixWorld, camera.projectionMatrixInverse);
      renderer.getDrawingBufferSize(v2); U.uRes.value.copy(v2);
      jar.visible = has;
      renderer.render(scene, camera);
    }
    let raf = 0, lastT = 0;
    function frame(t) {
      raf = 0;
      if (look.spin && !document.hidden) { const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0; lastT = t; cam.az += dt * 0.35; raf = requestAnimationFrame(frame); }
      else lastT = 0;
      draw();
    }
    const request = () => { if (!raf) raf = requestAnimationFrame(frame); };

    const stage = $("#stage");
    const resize = () => { const r = stage.getBoundingClientRect(); W = Math.max(1, Math.round(r.width)); Hh = Math.max(1, Math.round(r.height)); renderer.setSize(W, Hh, false); request(); };
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
    resize();
    canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); fail("The 3D view stopped. Reload the page to bring it back."); });

    // drag to turn, pinch or wheel to zoom, double-click to reset; arrow keys and +/- when focused
    const ptrs = new Map(); let pinch0 = 0, zoom0 = 1;
    const hideHint = () => { const h = $("#hint"); if (h) { h.dataset.used = "1"; h.classList.add("gone"); } };
    canvas.addEventListener("pointerdown", e => {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); hideHint();
      if (ptrs.size === 2) { const [a, b] = Array.from(ptrs.values()); pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = cam.zoom; }
    });
    canvas.addEventListener("pointermove", e => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      if (ptrs.size === 1) { cam.az -= dx * 0.009; cam.el = clamp(cam.el + dy * 0.007, -0.12, 1.45); request(); }
      else if (ptrs.size === 2 && pinch0 > 0) { const [a, b] = Array.from(ptrs.values()); cam.zoom = clamp(zoom0 * pinch0 / Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), 0.3, 3); request(); }
    });
    const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0; };
    canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
    canvas.addEventListener("wheel", e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * Math.exp(e.deltaY * 0.0012), 0.3, 3); request(); }, { passive: false });
    canvas.addEventListener("dblclick", () => preset("home"));
    canvas.addEventListener("keydown", e => {
      const k = e.key; let used = true;
      if (k === "ArrowLeft") cam.az += 0.15; else if (k === "ArrowRight") cam.az -= 0.15;
      else if (k === "ArrowUp") cam.el = clamp(cam.el + 0.1, -0.12, 1.45); else if (k === "ArrowDown") cam.el = clamp(cam.el - 0.1, -0.12, 1.45);
      else if (k === "+" || k === "=") cam.zoom = clamp(cam.zoom / 1.12, 0.3, 3); else if (k === "-") cam.zoom = clamp(cam.zoom * 1.12, 0.3, 3);
      else used = false;
      if (used) { e.preventDefault(); hideHint(); request(); }
    });

    function preset(n) {
      const a = lipAz(), p = { home: [a + 0.35, 0.16, 1], lip: [a, 0.10, 0.95], front: [a + Math.PI / 2, 0.14, 1], top: [a + 0.35, 1.15, 0.95] }[n];
      if (!p) return; [cam.az, cam.el, cam.zoom] = p; request();
    }
    function setMesh(m, info) {
      [[gOut, m.outer], [gIn, m.inner]].forEach(([geo, d]) => {
        geo.dispose();
        geo.setAttribute("position", new THREE.BufferAttribute(d.position, 3));
        geo.setAttribute("normal", new THREE.BufferAttribute(d.normal, 3));
        geo.setAttribute("lean", new THREE.BufferAttribute(d.lean, 1));
        geo.setIndex(new THREE.BufferAttribute(d.index, 1));
      });
      const p = info.P, M = info.M;
      dims = { H: info.H, R: Math.max(M.widest / 2, M.reach_max || 0) };
      U.uLayerH.value = p.layer_h; U.uGroove.value = 0.25 * p.layer_h; U.uFootH.value = info.foot_h; U.uCap.value = p.max_overhang_deg;
      U.uJarR.value = M.widest / 2; U.uFootR.value = M.foot_d / 2; U.uJarH.value = info.H; U.uJarC.value.set(0, info.H * 0.42, 0);
      if (!has) { has = true; preset("home"); }
      request();
    }
    function setLook(lk) {
      const s = LIGHTS[lk.light] || LIGHTS.studio, t = TINTS[lk.tint] || TINTS.clear;
      U.uBack.value.setRGB(...s.back); U.uBackTop.value.setRGB(...s.backTop); U.uFloor.value.setRGB(...s.floor); U.uHalo.value.setRGB(...s.halo);
      U.uKey.value.setRGB(...s.key); U.uKeyBox.value.set(...s.keyBox); U.uRim.value.setRGB(...s.rim); U.uRimAz.value = s.rimAz;
      U.uTopL.value.setRGB(...s.topL); U.uAmb.value.setRGB(...s.amb); U.uExposure.value = s.exposure;
      U.uTint.value.set(...t.rgb); U.uHaze.value = (1 - lk.clarity / 100) * 0.35; U.uLines.value = lk.lines ? 1 : 0;
      petg.visible = lk.view === "petg"; leanG.visible = lk.view === "lean";
      request();
    }
    function snapshot(w, h, caption, ink) {
      const pr = renderer.getPixelRatio(), W0 = W, H0 = Hh;
      renderer.setPixelRatio(1); renderer.setSize(w, h, false); W = w; Hh = h; draw();
      const c2 = document.createElement("canvas"); c2.width = w; c2.height = h;
      const cx = c2.getContext("2d"); cx.drawImage(canvas, 0, 0, w, h);
      if (caption) { const fs = Math.round(w * 0.017); cx.font = `500 ${fs}px "Hanken Grotesk", system-ui, sans-serif`; cx.fillStyle = ink; cx.fillText(caption, Math.round(w * 0.045), Math.round(h - w * 0.045)); }
      renderer.setPixelRatio(pr); W = W0; Hh = H0; renderer.setSize(W, Hh, false); draw();
      return c2;
    }
    return { setMesh, setLook, preset, snapshot, request };
  }

  /* ======================= start ======================= */
  function start(data) {
    const saved = data && data.P ? data : restore();
    if (saved) {
      sanitizeInto(P, saved.P);
      Object.assign(look, pick(saved.look, LOOK0)); Object.assign(out, pick(saved.out, OUT0));
      if (typeof saved.tab === "string") tab = saved.tab;
    }
    buildUI();
    viewer = makeViewer();
    refreshAll(); applyLook(); openTab(tab); requestLive(); initDownloads();
    try { const hot = window.claude && window.claude.hot; if (hot && hot.snapshot) hot.snapshot(() => ({ P, look, out, tab })); } catch (e) { /* not in the viewer */ }
  }
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
  } catch (e) { start({}); }
})();
</script>
